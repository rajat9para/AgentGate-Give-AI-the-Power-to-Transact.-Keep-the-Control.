# ============================================================
# AgentGate — Render Blueprint Infrastructure Specification
# Target: Backend API & Cryptographic Execution Gateway
# ============================================================

services:
  - type: web
    name: RazorX-Give-AI-the-Power-to-Transact-Keep-the-Control
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --include=dev && npm run build:api
    startCommand: npm run start --workspace=apps/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: REQUEST_TIMEOUT_MS
        value: "30000"
      
      # Frontend Web Origin (for CORS)
      - key: FRONTEND_URL
        sync: false

      # Supabase PostgreSQL (Privileged Server-Side Connection)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # AI Model Provider (Groq API)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # Razorpay Payment Gateway (Test or Production Mode)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Cloudinary Object & Document Storage
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        value: agentgate

      # Anti-Sleep & Free-Tier Optimization
      - key: SUPABASE_KEEP_ALIVE_INTERVAL_MS
        value: "12600000"
      - key: DATA_RETENTION_DAYS
        value: "15"

      # AgentGate Cryptographic Signing Authority (Ed25519)
      - key: AGENTGATE_KEY_ID
        value: agentgate-prod-2026-08-v1
      - key: AGENTGATE_SIGNING_KEY
        sync: false
